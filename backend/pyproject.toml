[project]
name = "transformer-observatory"
version = "0.1.0"
description = "Local, measured Transformer activation observatory"
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch==2.14.1",
  "transformers==5.18.0",
  "accelerate==1.15.0",
  "numpy>=2.3,<3",
  "scipy>=1.16,<2",
  "scikit-learn>=1.7,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.35,<1",
  "psutil>=7,<8",
  "safetensors>=0.6,<1",
]

[project.scripts]
observatory = "transformer_observatory.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
