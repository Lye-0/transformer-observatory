name: Validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  numerical-and-api:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.17'
      - name: Install CPU verification dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e backend pytest==9.1.1 httpx==0.28.1 ruff==0.17.1
      - run: python -m pytest backend/tests -q
      - run: python -m ruff check --config backend/pyproject.toml backend scripts/validate_model.py scripts/validate_research.py scripts/validate_tuned_lens.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise exec -- pnpm --dir frontend install --frozen-lockfile
      - run: mise exec -- pnpm --dir frontend test
      - run: mise exec -- pnpm --dir frontend run build
